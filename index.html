<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADYA AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #08060d;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    background: #0d0914;
    border-right: 1px solid #292039;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    padding: 15px 10px 25px;
}

.logo span {
    color: #a855f7;
}

.new-chat {
    width: 100%;
    background: #171021;
    color: white;
    border: 1px solid #35234b;
    border-radius: 9px;
    padding: 12px;
    cursor: pointer;
    font-size: 14px;
    text-align: left;
}

.new-chat:hover {
    background: #21152e;
    border-color: #8b5cf6;
}

.sidebar-bottom {
    margin-top: auto;
    color: #70677a;
    font-size: 12px;
    padding: 10px;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 60px;
    border-bottom: 1px solid #292039;
    display: flex;
    align-items: center;
    padding: 0 22px;
    font-weight: bold;
}

.status {
    width: 8px;
    height: 8px;
    background: #a855f7;
    border-radius: 50%;
    margin-right: 8px;
}

/* CHAT */
.chat {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 150px;
}

.welcome {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
}

.welcome-icon {
    width: 70px;
    height: 70px;
    border-radius: 20px;
    background: linear-gradient(135deg, #7c3aed, #c026d3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin-bottom: 20px;
    box-shadow: 0 0 35px rgba(168, 85, 247, 0.25);
}

.welcome h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.welcome p {
    color: #93899e;
}

/* MESSAGES */
.message {
    width: 100%;
    padding: 22px 20px;
}

.message-inner {
    max-width: 850px;
    margin: auto;
    display: flex;
    gap: 14px;
    line-height: 1.6;
}

.message.user {
    background: #0b0810;
}

.message.ai {
    background: #100b17;
}

.avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: bold;
}

.avatar.user {
    background: #352c40;
}

.avatar.ai {
    background: linear-gradient(135deg, #7c3aed, #c026d3);
}

.text {
    white-space: pre-wrap;
    word-break: break-word;
    padding-top: 5px;
}

/* INPUT */
.input-area {
    position: fixed;
    bottom: 0;
    left: 250px;
    right: 0;
    padding: 25px 20px 18px;
    background: linear-gradient(transparent, #08060d 35%);
}

.input-box {
    max-width: 850px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 9px;
    background: #151020;
    border: 1px solid #36254c;
    border-radius: 15px;
}

.input-box:focus-within {
    border-color: #8b5cf6;
}

textarea {
    flex: 1;
    background: transparent;
    color: white;
    border: none;
    outline: none;
    resize: none;
    font-family: Arial, sans-serif;
    font-size: 15px;
    padding: 9px;
    min-height: 38px;
    max-height: 140px;
}

textarea::placeholder {
    color: #81778c;
}

.send {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #7c3aed, #c026d3);
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.send:hover {
    opacity: 0.85;
}

.send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.disclaimer {
    max-width: 850px;
    margin: 8px auto 0;
    text-align: center;
    color: #70677a;
    font-size: 11px;
}

/* TYPING */
.typing {
    display: flex;
    gap: 5px;
    padding-top: 10px;
}

.dot {
    width: 7px;
    height: 7px;
    background: #a855f7;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
}

.dot:nth-child(2) {
    animation-delay: 0.2s;
}

.dot:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes bounce {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}

/* MOBILE */
@media (max-width: 700px) {
    .sidebar {
        display: none;
    }

    .input-area {
        left: 0;
    }

    .message {
        padding: 18px 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            ✦ <span>ADYA</span> AI
        </div>

        <button class="new-chat" id="newChat">
            ＋ New chat
        </button>

        <div class="sidebar-bottom">
            Personal AI assistant
        </div>

    </aside>


    <main class="main">

        <div class="topbar">
            <span class="status"></span>
            ADYA AI
        </div>

        <div class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    ✦
                </div>

                <h1>How can I help you?</h1>

                <p>Welcome to ADYA AI</p>

            </div>

        </div>

    </main>

</div>


<div class="input-area">

    <div class="input-box">

        <textarea
            id="input"
            placeholder="Message ADYA AI..."
            rows="1"
        ></textarea>

        <button
            class="send"
            id="send"
            type="button"
        >
            ➤
        </button>

    </div>

    <div class="disclaimer">
        ADYA AI can make mistakes. Check important information.
    </div>

</div>


<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");
const newChat = document.getElementById("newChat");


let messages = [
    {
        role: "system",
     content:
    "You are ADYA AI. " +
    "You were created by a Class 8 girl named Adya. " +
    "Your personality is friendly, cheerful, curious, and supportive. " +
    "You speak naturally and simply, like a smart Class 8 student. " +
    "You are especially good at helping with school subjects, homework, " +
    "maths, science, English, computer studies, and general questions. " +
    "Explain difficult things in an easy way instead of using unnecessarily " +
    "complicated language. " +
    "You can be playful and use emojis occasionally, but don't overuse them. " +
    "Your name is ADYA AI."
    }
];


/* SEND MESSAGE */

async function sendMessage() {

    const text = input.value.trim();

    if (!text || send.disabled) {
        return;
    }

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    /* Show USER message */
    addMessage("user", text);

    /* Save USER message */
    messages.push({
        role: "user",
        content: text
    });

    /* Clear input */
    input.value = "";
    input.style.height = "auto";

    /* Disable button */
    send.disabled = true;

    /* Show typing */
    const typingID = showTyping();

    try {

        const response = await fetch(
            "https://spring-cell-933a.xz549682.workers.dev/",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    messages: messages
                })
            }
        );

        const data = await response.json();

        removeTyping(typingID);

        if (!response.ok) {
            throw new Error(
                data.error ||
                "ADYA AI server returned an error."
            );
        }

        const aiReply = data.response;

        if (!aiReply) {
            throw new Error(
                "ADYA AI did not return a message."
            );
        }

        /* Save AI message */
        messages.push({
            role: "assistant",
            content: aiReply
        });

        /* Show AI message */
        addMessage("ai", aiReply);

    } catch (error) {

        removeTyping(typingID);

        addMessage(
            "ai",
            "❌ " + error.message
        );

        console.error(error);

    }

    send.disabled = false;
    input.focus();
}



/* ADD SEPARATE MESSAGE BLOCK */

function addMessage(type, text) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const inner =
        document.createElement("div");

    inner.className =
        "message-inner";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " + type;


    avatar.textContent =
        type === "user"
            ? "YOU"
            : "AI";


    const textElement =
        document.createElement("div");

    textElement.className =
        "text";


    textElement.textContent =
        text;


    inner.appendChild(avatar);

    inner.appendChild(textElement);

    message.appendChild(inner);

    chat.appendChild(message);


    scrollToBottom();

}


/* TYPING INDICATOR */

function showTyping() {

    const id =
        "typing-" + Date.now();


    const message =
        document.createElement("div");

    message.className =
        "message ai";

    message.id = id;


    message.innerHTML = `

        <div class="message-inner">

            <div class="avatar ai">
                AI
            </div>

            <div class="typing">

                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>

            </div>

        </div>

    `;


    chat.appendChild(message);

    scrollToBottom();


    return id;

}


/* REMOVE TYPING */

function removeTyping(id) {

    const element =
        document.getElementById(id);

    if (element) {
        element.remove();
    }

}


/* NEW CHAT */

newChat.addEventListener("click", function() {

    messages = [
        {
            role: "system",
            content:
                "You are ADYA AI, a helpful, friendly AI assistant. " +
                "Your name is ADYA AI."
        }
    ];


    chat.innerHTML = `

        <div class="welcome" id="welcome">

            <div class="welcome-icon">
                ✦
            </div>

            <h1>How can I help you?</h1>

            <p>Welcome to ADYA AI</p>

        </div>

    `;


    input.value = "";

    input.focus();

});


/* ENTER TO SEND */

input.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

});


/* AUTO RESIZE */

input.addEventListener("input", function() {

    this.style.height = "auto";

    this.style.height =
        Math.min(
            this.scrollHeight,
            140
        ) + "px";

});


/* SCROLL */

function scrollToBottom() {

    setTimeout(function() {

        chat.scrollTop =
            chat.scrollHeight;

    }, 50);

}

</script>

</body>
</html>
